<script>
    function startSimulation() {
        const ball = document.getElementById('ball');
        let startTime = null;
        const totalDuration = 3000; // 3 saniye (Task'taki süre)
        const containerWidth = document.getElementById('animation-container').offsetWidth - 30;

        function animate(currentTime) {
            if (!startTime) startTime = currentTime;
            let elapsed = currentTime - startTime;
            let t = elapsed / 1000; // Milisaniyeyi saniyeye çevir

            if (t <= 3) {
                // FİZİK FORMÜLÜ: s = 1/2 * a * t^2
                // Burada a = 2 m/s^2 verildiği için: s = 1/2 * 2 * t^2 => s = t^2
                // Maksimum s değerimiz 3'ün karesinden 9 metre.
                // Ekrandaki pozisyon oranı: (t^2 / 9)
                let positionRatio = (t * t) / 9; 
                let currentPos = positionRatio * containerWidth;

                ball.style.left = currentPos + 'px';
                
                // Opsiyonel: Topun içine o anki hızını yazdır (Hoca bayılır buna)
                let currentVelocity = (2 * t).toFixed(1);
                ball.innerHTML = `<span style="font-size:8px; color:black; display:block; margin-top:10px;">${currentVelocity}</span>`;

                requestAnimationFrame(animate);
            } else {
                // 3. saniye sonunda tam 9 metrede durdur
                ball.style.left = containerWidth + 'px';
                ball.innerHTML = `<span style="font-size:8px; color:black; display:block; margin-top:10px;">6.0</span>`;
            }
        }
        requestAnimationFrame(animate);
    }

    // Grafik aynı kalabilir, o zaten doğru.
    const tValues = [0, 0.5, 1, 1.5, 2, 2.5, 3];
    const vValues = tValues.map(t => 2 * t);
    Plotly.newPlot('plot', [{
        x: tValues, y: vValues,
        mode: 'lines+markers',
        line: {color: '#ffc107', width: 3},
        name: 'v(t) = 2t'
    }], {
        title: 'Velocity-Time Graph',
        margin: { t: 30, b: 30, l: 40, r: 10 },
        xaxis: {title: 'Time (s)'},
        yaxis: {title: 'Velocity (m/s)'}
    });
</script>
